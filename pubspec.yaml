name: indiangrill
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  file_picker: ^8.0.0
  carousel_slider_plus: ^6.0.0
  carousel_slider: ^5.1.1
  go_router: ^6.0.0
  flutter_dotenv: ^5.0.2
  http: ^1.2.2
  provider: ^6.1.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  date_field: 6.0.3+1
  date_picker_timeline: ^1.1.4
  table_calendar: ^3.1.2
  dropdown_button2:
    path: packages/dropdown_button2
  url_launcher: ^6.1.12
  cached_network_image: ^3.3.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.0.15
  font_awesome_flutter: ^10.4.0
  google_fonts: ^5.0.0
  flutter_lints: ^4.0.0
  google_maps_flutter: ^2.5.0
  flutter_launcher_icons: ^0.13.1
  intl: ^0.20.2
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/Indian-Grill-Logo.png
    - assets/images/uploads/2020/04/
    - assets/images/uploads/2016/11/
    - assets/images/uploads/2019/03/
    - assets/images/uploads/2017/05/
    - assets/images/uploads/2017/01/
    - assets/images/uploads/2017/02/
    - assets/images/uploads/dummy_image.jpg
    - assets/images/slider/
    - assets/images/uploads/
    - assets/images/uploads/head-chef-2.jpg
    - assets/woocommerce.env
    - assets/images/veg.png
    - assets/images/spicy.jpg
    - assets/images/timing.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/Indian-Grill-Logo.png"
  min_sdk_android: 21